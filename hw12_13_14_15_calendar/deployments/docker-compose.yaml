services:
  db:
    image: postgres:16.4
    container_name: calendar-db
    env_file: .env
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 1s
      timeout: 1s
      retries: 10

  db-migrations:
    image: calendar-db-migration:develop
    container_name: calendar-db-migration
    env_file: .env
    command: ["-path", "/migrations/", "-database", "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@calendar-db:${POSTGRES_PORT}/${POSTGRES_DATABASE}?sslmode=disable", "up"] 
    depends_on: 
      db:
        condition: service_healthy

networks:
  calendar:

